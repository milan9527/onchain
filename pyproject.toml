[project]
name = "onchain-control"
version = "0.1.0"
description = "Identity-bound agents, MCP and deterministic transaction controls on AWS AgentCore"
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.42,<2",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "mangum>=0.19,<1",
  "PyJWT[crypto]>=2.10,<3",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
runtime = ["mcp>=1.30,<2"]
dev = ["pytest>=8", "pytest-asyncio>=0.25", "ruff>=0.11"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["onchain*"]

[tool.pytest.ini_options]
pythonpath = ["backend", "."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
